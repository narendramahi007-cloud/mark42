        .search-container input { 
            width: 100%; padding: 15px 50px 15px 20px; border-radius: 25px; 
            border: 2px solid var(--accent); font-size: 16px; outline: none;
            background: var(--glass);
        }
        .search-icon-photo { 
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%); 
            width: 35px; height: 35px; background-image: url('nainital.png');
            background-size: cover; background-position: center;
            border-radius: 50%; border: 2px solid var(--accent);
        }

        .section-content { display: none; }
        .section-content.active { display: block; animation: fadeIn 0.4s ease; }
        
        .question-card { 
            background: var(--glass); padding: 25px; border-radius: 12px; 
            margin-bottom: 20px; border-left: 8px solid var(--accent);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

    function generateQuiz() {
        const container = document.getElementById('quizContainer');
        for (let section in quizData) {
            const div = document.createElement('div');
            div.id = section;
            div.className = `section-content ${section === 'linux' ? 'active' : ''}`;
            
            // Add Section Document Button
            const docBtn = document.createElement('button');
            docBtn.className = "inner-doc-btn";
            docBtn.innerText = `📖 Open ${section.toUpperCase()} Document`;
            docBtn.onclick = () => openDoc(`${section}.docx`);
            div.appendChild(docBtn);

            quizData[section].forEach((item, index) => {
                const card = `
                    <div class="question-card">
                        <span class="q-text">Q${index + 1}: ${item.q}</span>
                        <div class="options">
                            ${item.o.map((opt, i) => `
                                <div class="opt" onclick="check(this, ${i === item.a})">${opt}</div>
                            `).join('')}
                        </div>
                    </div>
                `;
                div.innerHTML += card;
            });
            container.appendChild(div);
        }
    }

    function showTab(id) {
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
        document.getElementById('docViewerContainer').style.display = 'none';
        document.getElementById('quizContainer').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function openDoc(fileName) {
        document.getElementById('quizContainer').style.display = 'none';
        const container = document.getElementById('docViewerContainer');
        container.style.display = 'block';
        const viewerUrl = "https://docs.google.com/gview?url=" + window.location.href.replace('index.html','') + fileName + "&embedded=true";
        document.getElementById('docFrame').src = viewerUrl;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function closeDoc() {
        document.getElementById('docViewerContainer').style.display = 'none';
        document.getElementById('quizContainer').style.display = 'block';
    }

    function check(el, isCorrect) {
        const parent = el.parentElement;
        parent.querySelectorAll('.opt').forEach(o => o.classList.remove('correct', 'wrong'));
        if (isCorrect) el.classList.add('correct');
        else el.classList.add('wrong');
    }

    function filterQuestions() {
        let input = document.getElementById('quizSearch').value.toLowerCase();
        let cards = document.querySelectorAll('.question-card');
        cards.forEach(card => {
            let text = card.innerText.toLowerCase();
            card.style.display = text.includes(input) ? "block" : "none";
        });
    }

    generateQuiz();
</script>
