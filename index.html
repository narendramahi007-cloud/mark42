    function init() {
        const area = document.getElementById('quizArea');
        for (let sec in quizData) {
            const div = document.createElement('div');
            div.id = sec;
            div.className = `section-content ${sec === 'linux' ? 'active-section' : ''}`;
            
            const docBox = document.createElement('div');
            docBox.className = "inner-doc-box";
            docBox.innerHTML = `<a href="#" class="inner-doc-link" onclick="openDocFile('${sec}.docx'); return false;">📖 OPEN ${sec.toUpperCase()} DOCUMENT</a>`;
            div.appendChild(docBox);

            quizData[sec].forEach((item, i) => {
                const card = document.createElement('div');
                card.className = "question-card";
                card.innerHTML = `<span class="q-text">Q${i+1}: ${item.q}</span>
                    <div class="options">
                        ${item.o.map((opt, idx) => `<div class="opt" onclick="checkAns(this, ${idx === item.a})">${opt}</div>`).join('')}
                    </div>`;
                div.appendChild(card);
            });
            area.appendChild(div);
        }
    }

    function switchTab(id) {
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active-section'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active-section');
        event.currentTarget.classList.add('active');
        document.getElementById('docViewerContainer').style.display = 'none';
        document.getElementById('quizArea').style.display = 'block';
        window.scrollTo(0,0);
    }

    function openDocFile(name) {
        document.getElementById('quizArea').style.display = 'none';
        const viewer = document.getElementById('docViewerContainer');
        viewer.style.display = 'block';
        let base = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
        const fileUrl = base + name;
        document.getElementById('docFrame').src = "https://docs.google.com/gview?url=" + encodeURIComponent(fileUrl) + "&embedded=true";
        window.scrollTo(0,0);
    }

    function checkAns(el, isCorrect) {
        const opts = el.parentElement.querySelectorAll('.opt');
        opts.forEach(o => o.classList.remove('correct', 'wrong'));
        el.classList.add(isCorrect ? 'correct' : 'wrong');
    }

    function filterQuiz() {
        let val = document.getElementById('quizSearch').value.toLowerCase();
        document.querySelectorAll('.question-card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(val) ? "block" : "none";
        });
    }

    init();
</script>
