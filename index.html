        .section-content.active { display: block; animation: fadeIn 0.4s ease; }
        
        .question-card {

    function generateQuiz() {
        const container = document.getElementById('quizContainer');
        for (let section in quizData) {
            const div = document.createElement('div');
            div.id = section;
            div.className = `section-content ${section === 'linux' ? 'active' : ''}`;
            
            quizData[section].forEach((item, index) => {
                const card = `
                    <div class="question-card">
                        <span class="q-text">Q${index + 1}: ${item.q}</span>
                        <div class="options">
                            ${item.o.map((opt, i) => `
                                <div class="opt" onclick="check(this, ${i === item.a})">${opt}</div>
                            `).join('')}
                        </div>
                    </div>
                `;
                div.innerHTML += card;
            });
            container.appendChild(div);
        }
    }

    function showTab(id) {
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
        window.scrollTo(0,0);
    }

    function showDoc() {
        showTab('docSection');
        // Google Docs Viewer URL to show the hosted .docx file
        const docUrl = "devops_doc.docx"; 
        const viewerUrl = "https://docs.google.com/gview?url=" + window.location.href.replace('index.html','') + docUrl + "&embedded=true";
        document.getElementById('docFrame').src = viewerUrl;
    }

    function check(el, isCorrect) {
        const parent = el.parentElement;
        parent.querySelectorAll('.opt').forEach(o => o.classList.remove('correct', 'wrong'));
        if (isCorrect) el.classList.add('correct');
        else el.classList.add('wrong');
    }

    generateQuiz();
