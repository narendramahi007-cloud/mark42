        .tab-btn { 
            background: #fff; border: none; color: #333; padding: 10px 14px; 
            cursor: pointer; font-weight: 600; font-size: 11px; border-radius: 5px; 
            transition: 0.3s; text-transform: uppercase; display: flex; align-items: center; gap: 5px;
        }
        
        .tab-btn.active { background: var(--accent); color: #fff; }
        .doc-btn { background: #ffcc00 !important; color: #000 !important; }

        .container { max-width: 1000px; margin: 10px auto; padding: 0 15px 100px 15px; min-height: 100vh; position: relative; }
        
        .search-container { position: relative; margin: 15px 0; }
        .search-container input { 
            width: 100%; padding: 15px 50px 15px 20px; border-radius: 25px; 
            border: 2px solid var(--accent); font-size: 16px; outline: none; background: var(--glass);
        }
        .search-icon-photo { 
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%); 
            width: 35px; height: 35px; background: url('nainital.png') center/cover;
            border-radius: 50%; border: 2px solid var(--accent);
        }

        .inner-doc-box { margin-bottom: 20px; }
        .inner-doc-link { display: inline-block; background: #2196F3; color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 10px rgba(33,150,243,0.3); }

        .section-content { display: none; width: 100%; }
        .active-section { display: block; animation: fadeIn 0.3s ease; }
        
        .question-card { 
            background: var(--glass); padding: 22px; border-radius: 12px; 
            margin-bottom: 15px; border-left: 8px solid var(--accent);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .q-text { font-size: 17px; font-weight: 600; color: #ad1457; display: block; margin-bottom: 12px; line-height: 1.4; }
        .options { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .opt { background: #fff; padding: 12px 18px; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; transition: 0.2s; }
        .opt:hover { border-color: var(--accent); transform: translateX(5px); }
        .correct { background: #c8e6c9 !important; border-color: #4caf50; font-weight: bold; color: #1b5e20; }
        .wrong { background: #ffcdd2 !important; border-color: #f44336; color: #b71c1c; }

        #docViewerContainer { width: 100%; height: 90vh; display: none; border-radius: 10px; overflow: hidden; background: white; }
        iframe { width: 100%; height: 100%; border: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        footer { position: fixed; bottom: 0; width: 100%; background: #333; color: white; text-align: center; padding: 12px; font-size: 13px; z-index: 2000; border-top: 3px solid var(--accent); }

    function init() {
        const area = document.getElementById('quizArea');
        for (let sec in quizData) {
            const div = document.createElement('div');
            div.id = sec;
            div.className = `section-content ${sec === 'linux' ? 'active-section' : ''}`;
            
            const docBox = document.createElement('div');
            docBox.className = "inner-doc-box";
            docBox.innerHTML = `<a href="#" class="inner-doc-link" onclick="openDocFile('${sec}.docx'); return false;">📖 OPEN ${sec.toUpperCase()} DOCUMENT</a>`;
            div.appendChild(docBox);

            quizData[sec].forEach((item, i) => {
                const card = document.createElement('div');
                card.className = "question-card";
                card.innerHTML = `<span class="q-text">Q${i+1}: ${item.q}</span>
                    <div class="options">
                        ${item.o.map((opt, idx) => `<div class="opt" onclick="checkAns(this, ${idx === item.a})">${opt}</div>`).join('')}
                    </div>`;
                div.appendChild(card);
            });
            area.appendChild(div);
        }
    }

    function switchTab(id) {
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active-section'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active-section');
        event.currentTarget.classList.add('active');
        document.getElementById('docViewerContainer').style.display = 'none';
        document.getElementById('quizArea').style.display = 'block';
        window.scrollTo(0,0);
    }

    function openDocFile(name) {
        document.getElementById('quizArea').style.display = 'none';
        const viewer = document.getElementById('docViewerContainer');
        viewer.style.display = 'block';
        let base = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
        const fileUrl = base + name;
        document.getElementById('docFrame').src = "https://docs.google.com/gview?url=" + encodeURIComponent(fileUrl) + "&embedded=true";
        window.scrollTo(0,0);
    }

    function checkAns(el, isCorrect) {
        const opts = el.parentElement.querySelectorAll('.opt');
        opts.forEach(o => o.classList.remove('correct', 'wrong'));
        el.classList.add(isCorrect ? 'correct' : 'wrong');
    }

    function filterQuiz() {
        let val = document.getElementById('quizSearch').value.toLowerCase();
        document.querySelectorAll('.question-card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(val) ? "block" : "none";
        });
    }

    init();
</script>
